name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - name: Generated Go types match the C headers
        run: scripts/gen-types.sh --check
      - name: C (gcc/clang, C/C++; unit tests under ASan/UBSan)
        run: make -s test-c
      - name: Go (vet; -race; interop with C processes, stress)
        run: make -s test-go
      - name: poll() benchmark
        run: |
          {
            echo "### poll() benchmark (${{ matrix.arch }})"
            echo '```'
            make -s bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
