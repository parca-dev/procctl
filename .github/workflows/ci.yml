name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - name: Kernel and feature report
        run: make -s kernel-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: types_gen.go matches c/procctl.h (go tool cgo -godefs)
        run: scripts/gen-types.sh --check
      - name: procctl.h compile matrix (gcc/clang, C/C++, system/bundled sdt.h)
        run: make -s test-c-compile
      - name: C unit tests (ASan/UBSan)
        run: make -s test-c
      - name: Go vet
        run: go vet ./...
      # Fuzz seed corpora, a 3 s stress and 200 model schedules; the long
      # versions (fuzzing, 15 min stress, 5000 schedules) run nightly.
      - name: Go tests (-race; interop, conformance, stress smoke, arbiter model and real holders)
        run: go test -race -count=1 -timeout 20m ./...
      - name: hello watcher as root (uprobes, mmap2 events, pid-namespace translation)
        run: make test-hello
      - name: poll() benchmark
        run: |
          {
            echo "### poll() benchmark (${{ matrix.arch }})"
            echo '```'
            make -s bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
