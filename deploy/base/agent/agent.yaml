apiVersion: v1
kind: Namespace
metadata:
  name: procctl-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: procctl-testagent
  namespace: procctl-system
  labels: {app: procctl-testagent}
spec:
  selector:
    matchLabels: {app: procctl-testagent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  template:
    metadata:
      labels: {app: procctl-testagent}
    spec:
      hostPID: true            # see every process on the node
      tolerations: [{operator: Exists}]
      terminationGracePeriodSeconds: 10
      containers:
        - name: agent
          image: ghcr.io/parca-dev/procctl-testagent:latest
          args: ["--rate=10", "--rescan=2s", "--lease=3s"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            runAsUser: 0
            capabilities:
              # SYS_PTRACE: pidfd_getfd, /proc/<pid>/fd, process_vm_readv.
              # BPF + PERFMON: the hello program and mapping events.
              # SYS_ADMIN: the uprobe PMU refuses CAP_PERFMON alone (7.0);
              # without it discovery degrades to mapping events + rescans.
              add: [SYS_PTRACE, BPF, PERFMON, SYS_ADMIN]
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
